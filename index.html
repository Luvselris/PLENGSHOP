<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PLENG SHOP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-top: #f9e6ee;
      --bg-mid: #f5d8e4;
      --bg-bottom: #f2cadb;
      --card-bg: rgba(255, 250, 252, 0.94);
      --soft-pink: #f8dce6;
      --border-pink: #eab6cb;
      --pink-accent: #e588ad;
      --pink-deep: #c95d89;
      --text-main: #5c434d;
      --text-muted: #947682;
      --shadow-soft: 0 8px 24px rgba(214, 130, 165, 0.22);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-pink);
      border-radius: 26px;
      padding: 18px 16px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 16px;
    }

    /* Header Profile */
    .profile-card {
      text-align: center;
      padding-bottom: 22px;
    }

    .banner-img {
      width: 100%;
      height: 138px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin-bottom: -44px;
      border: 2px solid #ffffff;
    }

    .avatar-img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      background: #ffffff;
      position: relative;
      z-index: 2;
      box-shadow: 0 4px 14px rgba(201, 93, 137, 0.25);
    }

    .shop-name {
      font-size: 21px;
      font-weight: 700;
      color: var(--pink-deep);
      margin-top: 10px;
    }

    .shop-bio {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.6;
      white-space: pre-line;
    }

    /* Section Title */
    .section-heading {
      font-size: 15px;
      font-weight: 700;
      color: var(--pink-deep);
      text-align: center;
      margin-bottom: 14px;
    }

    /* Highlights */
    .highlights-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 2px 6px;
      justify-content: flex-start;
      scrollbar-width: none;
    }

    .highlights-row::-webkit-scrollbar {
      display: none;
    }

    .highlight-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      min-width: 74px;
    }

    .highlight-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, #f7c5d8, var(--pink-deep));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .highlight-thumb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      background: #ffffff;
    }

    .highlight-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 6px;
      max-width: 82px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Reviews List */
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      max-height: 360px;
      overflow-y: auto;
    }

    .review-item {
      background: #ffffff;
      border: 1px solid var(--border-pink);
      border-radius: 18px;
      padding: 12px 14px;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .review-author {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .review-stars {
      font-size: 12.5px;
      letter-spacing: 1px;
    }

    .review-text {
      font-size: 13px;
      color: var(--text-main);
      margin-top: 5px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .review-date {
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 4px;
    }

    /* Review Form */
    .review-divider {
      border-top: 1.5px dashed var(--border-pink);
      padding-top: 14px;
    }

    .star-picker {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .star-choice {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.3;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .star-choice.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .form-field, .form-textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border-pink);
      border-radius: 16px;
      font-size: 13px;
      background: #ffffff;
      color: var(--text-main);
      outline: none;
      margin-bottom: 10px;
    }

    .form-field:focus, .form-textarea:focus {
      border-color: var(--pink-deep);
    }

    .submit-review-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #f3a6c3, var(--pink-deep));
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(201, 93, 137, 0.28);
    }

    .submit-review-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .footer-text {
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--pink-deep);
      margin-top: 18px;
    }

    /* Story Modal (ภาพเต็ม ไม่ตัดขอบ ไม่แตก) */
    .story-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 12, 16, 0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .story-modal.active {
      display: flex;
    }

    .story-viewer {
      width: 100%;
      max-width: 440px;
      height: 88vh;
      background: #140d10;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1.5px solid rgba(255, 255, 255, 0.16);
    }

    .story-progress-row {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      z-index: 15;
    }

    .story-progress-track {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 4px;
      overflow: hidden;
    }

    .story-progress-bar {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    .story-topbar {
      position: absolute;
      top: 22px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 15;
      color: #ffffff;
    }

    .story-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 10px 4px 4px;
      border-radius: 20px;
    }

    .story-meta img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .story-meta span {
      font-size: 13px;
      font-weight: 600;
    }

    .story-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
    }

    .story-stage {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .story-full-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .story-zone-prev, .story-zone-next {
      position: absolute;
      top: 64px;
      bottom: 0;
      width: 45%;
      z-index: 10;
      cursor: pointer;
    }

    .story-zone-prev { left: 0; }
    .story-zone-next { right: 0; }
  </style>
</head>
<body>

  <!-- เว้นว่างไว้สำหรับใส่ลิงก์เพลงภายหลัง -->
  <audio id="bgMusic" loop preload="auto" src=""></audio>

  <div class="container">
    <!-- โปรไฟล์และแบนเนอร์ -->
    <div class="card profile-card">
      <img id="shopBanner" class="banner-img" src="https://files.catbox.moe/lnmhl6.gif" alt="Banner">
      <img id="shopAvatar" class="avatar-img" src="https://files.catbox.moe/iyeseu.jpeg" alt="Profile">
      <h1 id="shopName" class="shop-name">PLENG SHOP</h1>
      <p id="shopBio" class="shop-bio">ยินดีต้อนรับเข้าสู่ร้าน PLENG SHOP</p>
    </div>

    <!-- ไฮไลท์ -->
    <div class="card">
      <div class="section-heading">Review Highli 💘</div>
      <div class="highlights-row" id="highlightsRow"></div>
    </div>

    <!-- รีวิวจากลูกค้า -->
    <div class="card">
      <div class="section-heading">Customer Review 💗</div>

      <div class="reviews-list" id="reviewsList">
        <p style="text-align: center; color: var(--text-muted); font-size: 13px;">กำลังโหลดรีวิว...</p>
      </div>

      <div class="review-divider">
        <div class="star-picker">
          <button type="button" class="star-choice active" onclick="pickStar(1)">⭐️</button>
          <button type="button" class="star-choice active" onclick="pickStar(2)">⭐️</button>
          <button type="button" class="star-choice active" onclick="pickStar(3)">⭐️</button>
          <button type="button" class="star-choice active" onclick="pickStar(4)">⭐️</button>
          <button type="button" class="star-choice active" onclick="pickStar(5)">⭐️</button>
        </div>

        <input type="text" id="reviewerName" class="form-field" placeholder="กรอกชื่อของคุณ">
        <textarea id="reviewerComment" class="form-textarea" rows="3" placeholder="เขียนข้อความรีวิว"></textarea>
        <button type="button" id="sendReviewBtn" class="submit-review-btn" onclick="submitReview()">ส่งรีวิว</button>
      </div>
    </div>

    <div class="footer-text">Thank you for your lovely review! 💕</div>
  </div>

  <!-- หน้าต่างดูสตอรี่ภาพเต็ม -->
  <div class="story-modal" id="storyModal">
    <div class="story-viewer">
      <div class="story-progress-row" id="storyProgressRow"></div>
      <div class="story-topbar">
        <div class="story-meta">
          <img id="storyAvatar" src="" alt="Cover">
          <span id="storyTitle">Review Highli 💘</span>
        </div>
        <button type="button" class="story-close" onclick="closeStoryModal()">✕</button>
      </div>
      <div class="story-stage">
        <img id="storyPhoto" class="story-full-img" src="" alt="Story">
        <div class="story-zone-prev" onclick="prevSlide()"></div>
        <div class="story-zone-next" onclick="nextSlide()"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const SITE_COLLECTION = "pleng_shop_site";
    const SITE_DOC = "main_config";
    const REVIEWS_COLLECTION = "pleng_shop_reviews";

    const DEFAULT_BANNER = "https://files.catbox.moe/lnmhl6.gif";
    const DEFAULT_AVATAR = "https://files.catbox.moe/iyeseu.jpeg";

    let highlightsData = [
      { title: "Review Highli 💘", cover: DEFAULT_AVATAR, stories: [] }
    ];

    function renderHighlights() {
      const row = document.getElementById("highlightsRow");
      row.innerHTML = "";

      highlightsData.forEach((hl, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "highlight-btn";
        btn.onclick = () => openStoryModal(idx);

        const coverUrl = hl.cover || (hl.stories && hl.stories[0]) || DEFAULT_AVATAR;
        const label = hl.title || "Review Highli 💘";

        btn.innerHTML = `
          <div class="highlight-ring">
            <img src="${coverUrl}" class="highlight-thumb" alt="${escapeText(label)}">
          </div>
          <div class="highlight-title">${escapeText(label)}</div>
        `;
        row.appendChild(btn);
      });
    }

    db.collection(SITE_COLLECTION).doc(SITE_DOC).onSnapshot(doc => {
      if (!doc.exists) {
        renderHighlights();
        return;
      }
      const data = doc.data() || {};
      if (data.banner) document.getElementById("shopBanner").src = data.banner;
      if (data.profile) document.getElementById("shopAvatar").src = data.profile;
      if (data.shopName) document.getElementById("shopName").textContent = data.shopName;
      if (typeof data.shopBio === "string") document.getElementById("shopBio").textContent = data.shopBio;

      const audioEl = document.getElementById("bgMusic");
      if (data.musicUrl && audioEl.src !== data.musicUrl) {
        audioEl.src = data.musicUrl;
      }

      if (Array.isArray(data.highlights) && data.highlights.length > 0) {
        highlightsData = data.highlights;
      }
      renderHighlights();
    });

    // Story Viewer
    let currentHlIdx = 0;
    let currentSlideIdx = 0;
    let slideTimer = null;
    const SLIDE_TIME = 4500;

    function openStoryModal(idx) {
      currentHlIdx = idx;
      currentSlideIdx = 0;
      const hl = highlightsData[idx];
      if (!hl || !Array.isArray(hl.stories) || hl.stories.length === 0) {
        alert("ยังไม่มีรูปภาพในไฮไลท์นี้");
        return;
      }

      document.getElementById("storyAvatar").src = hl.cover || hl.stories[0];
      document.getElementById("storyTitle").textContent = hl.title || "Review Highli 💘";

      const progRow = document.getElementById("storyProgressRow");
      progRow.innerHTML = "";
      hl.stories.forEach((_, i) => {
        const track = document.createElement("div");
        track.className = "story-progress-track";
        track.innerHTML = `<div class="story-progress-bar" id="sbar_${i}"></div>`;
        progRow.appendChild(track);
      });

      document.getElementById("storyModal").classList.add("active");
      showSlide();
    }

    function showSlide() {
      clearTimeout(slideTimer);
      const hl = highlightsData[currentHlIdx];
      const list = (hl && hl.stories) || [];
      if (currentSlideIdx >= list.length) {
        closeStoryModal();
        return;
      }

      document.getElementById("storyPhoto").src = list[currentSlideIdx];

      for (let i = 0; i < list.length; i++) {
        const bar = document.getElementById(`sbar_${i}`);
        if (!bar) continue;
        if (i < currentSlideIdx) {
          bar.style.transition = "none";
          bar.style.width = "100%";
        } else if (i === currentSlideIdx) {
          bar.style.transition = "none";
          bar.style.width = "0%";
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              bar.style.transition = `width ${SLIDE_TIME}ms linear`;
              bar.style.width = "100%";
            });
          });
        } else {
          bar.style.transition = "none";
          bar.style.width = "0%";
        }
      }

      slideTimer = setTimeout(() => {
        nextSlide();
      }, SLIDE_TIME);
    }

    function nextSlide() {
      const hl = highlightsData[currentHlIdx];
      if (!hl || !hl.stories) return;
      if (currentSlideIdx < hl.stories.length - 1) {
        currentSlideIdx++;
        showSlide();
      } else {
        closeStoryModal();
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        showSlide();
      }
    }

    function closeStoryModal() {
      clearTimeout(slideTimer);
      document.getElementById("storyModal").classList.remove("active");
    }

    // Reviews
    let selectedStar = 5;
    function pickStar(num) {
      selectedStar = num;
      const btns = document.querySelectorAll(".star-choice");
      btns.forEach((btn, i) => {
        if (i < num) btn.classList.add("active");
        else btn.classList.remove("active");
      });
    }

    db.collection(REVIEWS_COLLECTION).onSnapshot(snap => {
      const container = document.getElementById("reviewsList");
      if (snap.empty) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 13px;">ยังไม่มีรีวิว</p>`;
        return;
      }

      const items = [];
      snap.forEach(doc => items.push(doc.data()));
      items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      container.innerHTML = items.map(item => `
        <div class="review-item">
          <div class="review-top">
            <span class="review-author">${escapeText(item.name || "ลูกค้า")}</span>
            <span class="review-stars">${"⭐️".repeat(item.stars || 5)}</span>
          </div>
          <div class="review-text">${escapeText(item.feedback || "")}</div>
          <div class="review-date">${escapeText(item.dateStr || "")}</div>
        </div>
      `).join("");
    });

    async function submitReview() {
      const nameEl = document.getElementById("reviewerName");
      const commentEl = document.getElementById("reviewerComment");
      const btn = document.getElementById("sendReviewBtn");

      const name = nameEl.value.trim();
      const feedback = commentEl.value.trim();

      if (!name || !feedback) {
        alert("กรุณากรอกชื่อและข้อความรีวิว");
        return;
      }

      btn.disabled = true;
      try {
        const now = new Date();
        const dateStr = now.toLocaleDateString("th-TH", { day: "numeric", month: "short" });

        await db.collection(REVIEWS_COLLECTION).add({
          name,
          stars: selectedStar,
          feedback,
          dateStr,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        nameEl.value = "";
        commentEl.value = "";
        pickStar(5);
        alert("ส่งรีวิวเรียบร้อยแล้ว");
      } catch (err) {
        alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
      } finally {
        btn.disabled = false;
      }
    }

    function escapeText(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // เล่นเพลงเมื่อมีการแตะหน้าจอ หากมีการตั้งค่าลิงก์เพลงไว้
    const bgAudio = document.getElementById("bgMusic");
    function startAudioIfReady() {
      if (bgAudio.getAttribute("src") && bgAudio.paused) {
        bgAudio.play().catch(() => {});
      }
    }
    document.addEventListener("touchstart", startAudioIfReady, { passive: true });
    document.addEventListener("click", startAudioIfReady, { passive: true });

    renderHighlights();
  </script>
</body>
</html>
